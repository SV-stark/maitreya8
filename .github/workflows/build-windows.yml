name: Build Windows Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        cache: true
        install: >-
          mingw-w64-x86_64-wxwidgets3.2-msw
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          make
          zip
          dos2unix

    - name: Install Inno Setup
      run: choco install innosetup

    - name: Compiling source code
      shell: msys2 {0}
      run: |
        mingw32-make -f Makefile.win release RELEASE_DIR=release_v8
        
    - name: Copy dependencies
      shell: msys2 {0}
      run: |
        mkdir -p release_v8
        echo "Resolving dependencies..."
        # Use ldd to find all dependencies located in /mingw64/
        # awk '{print $3}' extracts the path from lines like: "libname.dll => /path/to/libname.dll (address)"
        deps=$(ldd release_v8/maitreya8.exe | grep '/mingw64/' | awk '{print $3}' | sort | uniq)
        for dep in $deps; do
          cp "$dep" release_v8/
          echo "Copied $dep"
        done
        # Check files
        ls -l release_v8/

    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Maitreya8_Setup
        path: installers/Maitreya8_Setup.exe

    - name: Nightly Release
      uses: ncipollo/release-action@v1
      if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
      with:
        artifacts: "installers/Maitreya8_Setup.exe"
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: "nightly"
        name: "Nightly Build"
        body: "Automatic nightly build. Valid for testing."
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        prerelease: true
